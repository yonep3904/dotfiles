# ------------------------------------------------
# Appearance / Window
# ------------------------------------------------
initial_window_width 90c
initial_window_height 28c
window_padding_width 8
background_opacity 0.75

# macOS / Wayland では blur 有効
background_blur 1

# タイトルにカレントディレクトリ表示
window_title_format "{cwd}"

# ------------------------------------------------
# Font
# ------------------------------------------------
font_family HackGen Console NF
font_size 14.0

# リガチャ無効（好みで）
disable_ligatures never

# ------------------------------------------------
# Colors (TokyoNight Night ベース)
# ------------------------------------------------
foreground #c0caf5
background #1a1b26

selection_foreground #c0caf5
selection_background #283457

cursor #c0caf5
cursor_text_color #1a1b26

# ANSI colors
color0  #15161e
color1  #f7768e
color2  #9ece6a
color3  #e0af68
color4  #7aa2f7
color5  #bb9af7
color6  #7dcfff
color7  #a9b1d6
color8  #414868
color9  #f7768e
color10 #9ece6a
color11 #e0af68
color12 #7aa2f7
color13 #bb9af7
color14 #7dcfff
color15 #c0caf5

# ------------------------------------------------
# Scrolling
# ------------------------------------------------
scrollback_lines 10000

# ------------------------------------------------
# Clipboard / Selection
# ------------------------------------------------
copy_on_select yes
enable_audio_bell no

# Wayland / Linux での clipboard 安定化
clipboard_control write-clipboard write-primary read-clipboard-ask

# ------------------------------------------------
# Mouse
# ------------------------------------------------
hide_mouse_when_typing yes

# ------------------------------------------------
# Performance（重要）
# ------------------------------------------------
# GPUレンダリング最適化
repaint_delay 10
input_delay 3
sync_to_monitor yes

# ------------------------------------------------
# Keyboard
# ------------------------------------------------
map f11 toggle_fullscreen

# タブ操作（便利）
map ctrl+shift+t new_tab
map ctrl+shift+w close_tab
map ctrl+tab next_tab
map ctrl+shift+tab previous_tab

# ウィンドウ分割
map ctrl+shift+enter launch --location=hsplit
map ctrl+shift+v launch --location=vsplit

# ------------------------------------------------
# Shell integration（おすすめ）
# ------------------------------------------------
shell_integration enabled

# ------------------------------------------------
# Cursor
# ------------------------------------------------
cursor_shape block
cursor_blink_interval 0.5
